# ============================================================
# 東光醫療器材 — Sveltia CMS 商品管理後台設定
# Sveltia CMS 相容 Decap CMS 設定格式（本檔即採用該語法）
# ============================================================

# 本機編輯模式：在 localhost 開啟後台時，直接讀寫本機資料夾（不需登入 GitHub）
# 正式站（非 localhost）會自動忽略此設定，改走下方 GitHub backend
local_backend: true

backend:
  name: github
  repo: dongguang-medical/dongguang-medical.github.io
  branch: main
  # base_url：GitHub OAuth 代理（Cloudflare Worker）的網址。
  # 只填根網址，不含 /callback、不加結尾斜線。部署方式見 docs/後台部署設定.md
  base_url: https://sveltia-cms-auth.zirulin810.workers.dev

# 網站資訊（後台右上角可快速開啟正式網站）
site_url: https://dongguang-medical.github.io
display_url: https://dongguang-medical.github.io

# 圖片上傳位置
media_folder: assets/uploads        # 存進 repo 的實際資料夾
public_folder: /assets/uploads      # 網頁上引用的公開路徑

# 檔名（slug）產生規則：轉成 ASCII、去除重音符號，
# 避免產生中文檔名（中文商品名交由下方 collection 的 slug 樣板處理）
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: products
    label: 商品
    label_singular: 商品
    folder: content/products
    create: true
    delete: true
    format: frontmatter        # YAML frontmatter + Markdown 內文
    extension: md
    identifier_field: name
    summary: "{{name}}｜{{taxonomy}}"
    sortable_fields: [name, taxonomy, price]
    view_filters:
      - label: 尚未上架
        field: published
        pattern: false
    # 檔名樣板：日期 + 短亂數 ID，保證是英文/數字檔名，
    # 不會因中文商品名產生中文檔名（{{uuid_short}} 為 Sveltia 支援的標籤）
    slug: "{{year}}{{month}}{{day}}-{{uuid_short}}"
    # 保持介面極簡：關閉編輯預覽面板（網站無對應預覽樣板，開著只會佔空間）
    editor:
      preview: false
    fields:
      - label: 商品名稱
        name: name
        widget: string
        required: true
        hint: 顯示在網站上的商品名稱

      # 主分類與子分類合併為單一欄位，避免選出「行動輔具＋氣墊床」這種
      # 不存在的組合。下拉可直接打字篩選：輸入「行動」只剩該類、輸入
      # 「氣墊」直接命中。
      # ⚠️ 以下選項由 scripts/data/taxonomy.tsv 產生，請勿手改。
      #    新增子分類請改該檔案後執行：python scripts/gen_cms_options.py
      - label: 商品分類
        name: taxonomy
        widget: select
        required: true
        # >>> TAXONOMY_OPTIONS_START
        options:
          # 行動輔具
          - { label: "行動輔具 › 拐杖", value: "行動輔具/拐杖" }
          - { label: "行動輔具 › 輪椅", value: "行動輔具/輪椅" }
