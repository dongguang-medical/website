      # 只填數字，網站上的「NT$」與千分位由產生器加。存成數字後台才排得動序，
      # 存字串的話「NT$12,800」會排在「NT$170」前面。
      - label: 售價
        name: price
        widget: number
        value_type: int
        min: 0
        required: false
        hint: 只填數字，例 3500（網站會顯示成 NT$3,500）。留空會顯示「歡迎洽詢」。不同規格不同價請改用下面的「規格與價格」

      # 多規格商品：一列一個規格，各自綁自己的價格。有填這裡就不用填上面的售價，
      # 網站顯示的價格區間（NT$450～630）由這份清單自動算出來。
      - label: 規格名稱
        name: variant_label
        widget: string
        required: false
        hint: 這些規格是在分什麼，例「尺寸」「顏色」「款式」。留空會顯示「規格」

      - label: 規格與價格
        name: variants
        widget: list
        required: false
        label_singular: 規格
        summary: "{{fields.label}}　NT${{fields.price}}"
        hint: 不同規格不同價時用這裡，一列一個規格。只有單一價格的商品請留空，改填上面的售價
        fields:
          - { label: 規格, name: label, widget: string }
          - { label: 價格, name: price, widget: number, value_type: int, min: 0 }

      # 法定標示整段收在這裡，不要混進商品說明。販售藥商（東光自己）的資訊
      # 由產生器自動附在下方，不必寫在這裡。
      - label: 法定標示
        name: regulatory
        widget: text
        required: false
        hint: 依序填許可證字號、許可證品名、持證藥商、製造廠、製造廠地址。非管制品（碗盤、保健食品等）請留空

      - label: 提供方式
        name: offering
        widget: select
        multiple: true
        required: true
        default: [門市洽詢]
        options:
          - 線上選購
          - 門市洽詢
        hint: 可複選。勾選「線上選購」請一併填下面的蝦皮商品連結

      # 租賃是「是／否」的性質，用開關比多選清單好按，也不會跟提供方式混在一起
      - label: 可租賃
        name: rentable
        widget: boolean
        default: false
        hint: 開啟後會出現在網站的租賃專區，商品卡也會顯示「可租賃」

      - label: 租金
        name: rental_price
        widget: string
        required: false
        hint: 只有可租賃的商品要填。例 800/月、1500/季（會原樣顯示）

      # 只有「提供方式」勾了網購的商品才需要填，商品頁會據此顯示蝦皮購買按鈕
      - label: 蝦皮商品連結
        name: shopee_url
        widget: string
        required: false
        pattern:
          - '^(https://shopee\.tw/.+)?$'
          - 請填完整的蝦皮商品網址，需以 https://shopee.tw/ 開頭
        hint: 勾選「網購」時填入。商品頁會顯示「到蝦皮下單」按鈕

      - label: 可申請補助
        name: subsidy
        widget: select
        multiple: true
        required: false
        options:
          - 長照2.0輔具補助
          - 身障輔具補助
        hint: 可複選，沒有就不用勾

      # 品牌改為關聯欄位：只能從「品牌」清單挑選，打不出錯字，
      # 也讓品牌本身能帶原廠窗口、圖片素材狀態等資訊
      - label: 品牌
        name: brand
        widget: relation
        collection: brands
        search_fields: [name, slug]
        display_fields: [name]
        value_field: slug
        required: false
        hint: 找不到品牌時，請先到左側「品牌」新增一筆

      - label: 標籤
        name: tags
        widget: list
        required: false
        hint: 行銷用語，例：保固一年、台灣製造（補助與租賃已有專屬欄位，不必重複填）

      - label: 規格
        name: specs
        widget: list
        required: false
        label_singular: 規格
        summary: "{{fields.label}}：{{fields.value}}"
        fields:
          - label: 項目
            name: label
            widget: string
          - label: 數值
            name: value
            widget: string

      - label: 商品照片
        name: images
        widget: list
        required: false
        label_singular: 照片
        hint: 第一張會作為封面。建議每張 500KB 以內。
        field:
          label: 照片
          name: image
          widget: image

      - label: 上架顯示
        name: published
        widget: boolean
        default: true
        hint: 關閉後商品不會出現在網站上（不用刪除商品）

      - label: 熱銷精選
        name: featured
        widget: boolean
        default: false
        hint: 開啟後會出現在首頁「熱銷精選」輪播

      - label: 商品說明
        name: body
        widget: markdown
        required: false

  # ── 品牌 ────────────────────────────────────────────────
  # 商品的品牌欄位由此清單提供選項。除了避免打錯字，也把原廠聯絡窗口
  # 與「商品圖片素材拿到了沒」集中管理——這是目前最需要追蹤的事。
  - name: brands
    label: 品牌
    label_singular: 品牌
    folder: content/brands
    create: true
    delete: true
    format: frontmatter
    extension: md
    identifier_field: name
    summary: "{{name}}｜素材：{{asset_status}}"
    sortable_fields: [name, asset_status]
    slug: "{{fields.slug}}"
    editor:
      preview: false
    fields:
      - label: 品牌代碼
        name: slug
        widget: string
        required: true
        hint: 英文或中文皆可，建立後請勿修改（商品是靠這個代碼指向品牌的）

      - label: 品牌名稱
        name: name
        widget: string
        required: true
        hint: 顯示在網站上的名稱，可隨時修改

      - label: 原廠官網
        name: website
        widget: string
        required: false

      - label: 聯絡窗口
        name: contact
        widget: string
        required: false
        hint: 業務電話或 email，向原廠索取型錄與商品圖時使用

      - label: 圖片素材狀態
        name: asset_status
        widget: select
        default: 未接洽
        options:
          - 未接洽
          - 已寄信待回覆
          - 已取得授權
          - 原廠不提供
        hint: 追蹤商品照片的取得進度

      - label: 主力品牌
        name: featured
        widget: boolean
        default: false
        hint: 開啟後會顯示在品牌列表前段

      - label: 備註
        name: body
        widget: markdown
        required: false
