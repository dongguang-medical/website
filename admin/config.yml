          - { label: "呼吸照護 › 陽壓呼吸器配件", value: "呼吸照護/陽壓呼吸器配件" }
          - { label: "呼吸照護 › 抽痰機耗材", value: "呼吸照護/抽痰機耗材" }
          - { label: "呼吸照護 › 睡眠輔助", value: "呼吸照護/睡眠輔助" }
          - { label: "呼吸照護 › 拍痰器", value: "呼吸照護/拍痰器" }
          - { label: "呼吸照護 › 陽壓呼吸器", value: "呼吸照護/陽壓呼吸器" }
          - { label: "呼吸照護 › 氧氣用品", value: "呼吸照護/氧氣用品" }
          - { label: "呼吸照護 › 噴霧器配件", value: "呼吸照護/噴霧器配件" }
          - { label: "呼吸照護 › 吸鼻器", value: "呼吸照護/吸鼻器" }
          # 健康量測
          - { label: "健康量測 › 血壓計", value: "健康量測/血壓計" }
          - { label: "健康量測 › 血糖機", value: "健康量測/血糖機" }
          - { label: "健康量測 › 體溫計", value: "健康量測/體溫計" }
          - { label: "健康量測 › 體重與體脂計", value: "健康量測/體重與體脂計" }
